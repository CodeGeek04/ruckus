name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing, so stop it and free the runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Placeholders. NEXT_PUBLIC_* values are inlined at build time, and the
      # build is only a compile check here, never deployed. Real values live in
      # the Vercel project. Nothing secret belongs in this file.
      NEXT_PUBLIC_EVENTS_HTTP: example.appsync-api.ap-south-1.amazonaws.com
      NEXT_PUBLIC_EVENTS_REALTIME: example.appsync-realtime-api.ap-south-1.amazonaws.com
      NEXT_PUBLIC_EVENTS_API_KEY: da2-ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
